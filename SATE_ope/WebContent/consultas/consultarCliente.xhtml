<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/plantilla/plantilla.xhtml">


	<ui:define name="metadata">
	</ui:define>
	<ui:define name="content">

		<h2>CONSULTAR CLIENTE</h2>

		<h:form id="formConsultarCliente">

			<center>
				<p:panel style="margin:30px 80px 30px 80px;padding:20px;">

					<h:panelGrid style="width:90%;" columns="1">
						<p:panelGrid columns="4" id="pgBusqueda"
							style="margin:20px auto 20px auto;" layout="grid">
							<h:outputText value="Consultar por" />
							<p:selectOneMenu id="somTipoBusqueda"
								widgetVar="selectTipoBusqueda" 
								style="width:162px;vertical-align:middle;margin-left:20px;"
								value="#{consultarClienteController.consultarClienteModel.tipoBusqueda}"
								required="true" requiredMessage="Seleccione tipo de documento">
								<p:ajax event="change" update="formConsultarCliente:numDocu" />
								<f:selectItems
									value="#{consultarClienteController.consultarClienteModel.listaTipoBusqueda}"
									var="item" itemLabel="#{item.descripcion}"
									itemValue="#{item.id}" />
							</p:selectOneMenu>
							<p:inputText style="margin-left:20px;" id="numDocu"
								required="true"
								onkeypress="javascript:return jsValidarKey(event,/[0-9]/);"
								value="#{consultarClienteController.consultarClienteModel.numDocumento}"								
								maxlength="#{consultarClienteController.consultarClienteModel.obtenerBusquedaLength()}"
								requiredMessage="#{consultarClienteController.consultarClienteModel.obtenerBusquedaRequiredMessage()}"
								validatorMessage="#{consultarClienteController.consultarClienteModel.obtenerBusquedaValidatorMessage()}">
								<f:validateLength
									minimum="#{consultarClienteController.consultarClienteModel.obtenerBusquedaLength()}" />
							</p:inputText>
							
							<p:commandButton id="buscarCliente" value="Buscar"
							styleClass="btnGrande"
							process="@this somTipoBusqueda,numDocu,pgResultado"
						
							actionListener="#{consultarClienteController.consultarCliente()}"
							onstart="PF('statusDialog').show()"
							oncomplete="PF('statusDialog').hide()"
							update="formConsultarCliente:pgResultado"
							 />						

							

						</p:panelGrid>
						
						<p:panelGrid columns="1" id="pgBus"
							style="margin:20px auto 20px auto;" layout="grid">
							<p:messages id="msgs" autoUpdate="true" showDetail="true"
							showSummary="false" closable="true" />
						</p:panelGrid>
						
							
						<div class="dashed"></div>
						
						
						
					</h:panelGrid>
								
					
					<h:panelGrid id="pgResultado" style="width:90%;text-align:center;"
						columns="1">
						<p:panelGrid style="margin:auto;text-align:left;" columns="2"
							rendered="#{consultarClienteController.consultarClienteModel.busquedaRealizada}"
							layout="grid">

							<p:panel style="margin:10px 20px;padding:20px;">
								<h3 style="text-align: center">Datos del cliente</h3>
								<div class="dashed"></div>
								<h:panelGrid columns="2">
									<h:outputText value="Tipo de documento" />
									<h:outputText value="Número de documento"
										style="margin-left:20px;" />
									<p:inputText id="somTipoDocumento" readonly="true"
										value="#{consultarClienteController.consultarClienteModel.descripcionTipoDocumento(consultarClienteController.consultarClienteModel.datosTarjetaCliente.cliente.tipoDocumento)}" 
										/>
									<p:inputText id="numeroDocumento" readonly="true"
										style="margin-left:20px;"
										value="#{consultarClienteController.consultarClienteModel.datosTarjetaCliente.cliente.nroDocumento}"
										 />

									<h:outputText value="Nombres" />
									<h:outputText value="Apellidos" style="margin-left:20px;" />
									<p:inputText id="itNombres" readonly="true"
										value="#{consultarClienteController.consultarClienteModel.datosTarjetaCliente.cliente.nombres}" 
										/>
									<p:inputText id="itApellidos" style="margin-left:20px;"
										readonly="true"
										value="#{consultarClienteController.consultarClienteModel.datosTarjetaCliente.cliente.apCompleto}" 
										/>
										
										
									<h:outputText value="Correo electrónico" />
									<h:outputText value="Número de celular"
										style="margin-left:20px;" />
									<p:inputText id="email" maxlength="30" 									
										value="#{consultarClienteController.consultarClienteModel.datosTarjetaCliente.tarjeta.email}"
										validatorMessage="Correo electrónico no válido">
										<p:ajax update="msgs" event="keyup" />
										<f:validateRegex
											pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
									</p:inputText>
									
									<p:inputText 
									id="numcelular" 
									style="margin-left:20px;" 
									 required="true"
						            onkeypress="javascript:return jsValidarKey(event,/[0-9]/);"
						            requiredMessage="#{valMsg['required.numCelular']}"
						            maxlength="9"
						            validatorMessage="#{valMsg['validator.numCelular']}"										
									value="#{consultarClienteController.consultarClienteModel.datosTarjetaCliente.cliente.numCelular}" >
									 <p:ajax update="msgs" event="keyup" />
						            <f:validateRegex pattern="^9[0-9]{8}$*" />
									</p:inputText>	
								</h:panelGrid>

							</p:panel>
						</p:panelGrid>
						
						<p:panelGrid columns="1"
							style="margin-top:30px;width:90%;margin:auto;"
							rendered="#{consultarClienteController.consultarClienteModel.busquedaRealizada}"
							>
							<div class="dashed"></div>

							
							<p:commandButton id="actualizarDatos" value="Actualizar"
								styleClass="btnGrande"	
								process="@this email,numcelular"							
								actionListener="#{consultarClienteController.actualizarDatosCliente()}"
								onstart="PF('statusDialog').show()"
							oncomplete="PF('statusDialog').hide()"
							update="formConsultarCliente"
								 />
						</p:panelGrid>
						
								
						
						
					</h:panelGrid>
					
				</p:panel>
			</center>

		</h:form>
	
		
		
		
	</ui:define>
</ui:composition>
