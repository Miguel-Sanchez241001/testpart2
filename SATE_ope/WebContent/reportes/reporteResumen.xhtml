<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	template="/plantilla/plantilla.xhtml">


	<ui:define name="metadata">
	</ui:define>
	<ui:define name="content">

		<h2>REPORTES</h2>

		<h:form id="formReporteTarjeta">
			<input type="hidden" name="csrf_token"
				value="#{sessionScope.csrf_token}" />
			<center>
				<p:panel style="margin:30px 80px 30px 80px;padding:20px;">
					<h:panelGrid style="width:80%;text-align:center;">
						<p:panelGrid columns="2" style="margin:0 auto 10px;">
							<h:outputText value="Reporte resumen *" />

							<p:selectOneMenu id="selectTipoReporte"
								style="width:300px;vertical-align:middle;"
								value="#{reporteResumenController.reporteResumenModel.tipoReporteSeleccionado}"
								required="true" requiredMessage="Seleccione tipo de reporte">
								<f:selectItem itemLabel="Seleccione" itemValue="#{null}" />
								<f:selectItems
									value="#{reporteResumenController.reporteResumenModel.listaReporteResumen}"
									var="item" itemLabel="#{item.descripcion}"
									itemValue="#{item.id}" />
							</p:selectOneMenu>
							<h:outputText value="Fecha *" />
							<h:panelGrid columns="4">
								<h:outputText value="Del" />
								<p:inputMask id="maskFechaCorteInicial"
									value="#{reporteResumenController.reporteResumenModel.fechaCorteInicialSeleccionada}"
									mask="99/99/9999" required="true" placeholder="DD/MM/AAAA"
									requiredMessage="Ingrese una fecha inicial"
									validatorMessage="la fecha inicio tiene el formato de DD/MM/AAAA"
									style="width:120px;">
									<f:validator validatorId="fechaValidator" />
								</p:inputMask>

								<h:outputText value="Al" />
								<p:inputMask id="maskFechaCorteFinal"
									value="#{reporteResumenController.reporteResumenModel.fechaCorteFinalSeleccionada}"
									mask="99/99/9999" required="true" placeholder="DD/MM/AAAA"
									requiredMessage="Ingrese una fecha final"
									validatorMessage="la fecha fin tiene el formato de DD/MM/AAAA"
									style="width:120px;">
									<f:validator validatorId="fechaValidator" />
								</p:inputMask>
							</h:panelGrid>



						</p:panelGrid>

						<p:commandButton id="buscarDatosReporte" value="Buscar"
							styleClass="btnGrande"
							process="@this selectTipoReporte,maskFechaCorteInicial,maskFechaCorteFinal"
							update="formReporteTarjeta"
							actionListener="#{reporteResumenController.buscarReporte()}" />


						<div>
							<p:messages id="msgs" showDetail="true" showSummary="false"
								closable="true" />
						</div>

						<div class="dashed"></div>

						<p:panel id="pgReporte" style="margin-top:10px;border:none;">
							<center>
								<p:panel id="listaTarjetasPanel"
									rendered="#{reporteResumenController.reporteResumenModel.listaTarjetas!=null and !reporteResumenController.reporteResumenModel.listaTarjetas.isEmpty() and reporteResumenController.reporteResumenModel.tipoReporteSeleccionado==1}">
									<p:panelGrid id="pgExporter" columns="2"
										style="float:right;margin-right:2px;">

										<p:commandButton value="Descargar Documento"
											icon="ui-icon-arrowthick-1-s" ajax="false">
											<p:dataExporter type="xls" target="dtListadoTarjetas"
												fileName="lista_Tarjetas"
												postProcessor="#{reporteResumenController.customizeXLS}" />
										</p:commandButton>
									</p:panelGrid>
									<p:dataTable var="tarjeta" id="dtListadoTarjetas"
										paginator="true" paginatorPosition="bottom" rows="5"
										paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport}
									 {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
										currentPageReportTemplate="{currentPage} de {totalPages}"
										rowsPerPageTemplate="5,10,15"
										value="#{reporteResumenController.reporteResumenModel.listaTarjetas}"
										rowKey="#{tarjeta.id}" style="margin-top:30px;width:100%;"
										rowIndexVar="index" emptyMessage="No hay tarjetas">


										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Usuario creador" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.usuarioCreacion!=null?tarjeta.usuarioCreacion:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha Creación" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.fechaCreacion!=null?tarjeta.fechaCreacion:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Estado Tarjeta" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.estado!=null?reporteResumenController.reporteResumenModel.estadoEnLetras(tarjeta.estado):'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Cod. Estado" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.motivo!=null?tarjeta.motivo:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Descripcion Estado" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.estado!=null?reporteResumenController.reporteResumenModel.motivoEnLetras(tarjeta.motivo):'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha Estado Tarjeta" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.fechaEstado!=null?tarjeta.fechaEstado:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Tipo de Tarjeta" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.tipoTarjeta!=null?  reporteResumenController.reporteResumenModel.descripcionTipoTar(tarjeta.tipoTarjeta,tarjeta.diseno)  :'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Número de Tarjeta" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.numTarjeta!=null?tarjeta.numTarjeta:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Tipo de Documento" />
											</f:facet>
											<h:outputText
												value="#{reporteResumenController.reporteResumenModel.tipoDocumentoLetras(tarjeta.tipoDocumento)}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Número de Documento" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.numeroDocumento!=null?tarjeta.numeroDocumento:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Nombres" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.nombres!=null?tarjeta.nombres:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Apellidos" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.apellidos!=null?tarjeta.apellidos:'--'}" />
										</p:column>}
											<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Telefono" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.telefono!=null?tarjeta.telefono:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Correo" />
											</f:facet>
											<h:outputText
												value="#{tarjeta.correo!=null?tarjeta.correo:'--'}" />
										</p:column>
									</p:dataTable>
								</p:panel>


								<p:panel id="listaTransaccionPanel"
									rendered="#{reporteResumenController.reporteResumenModel.listaTransacciones!=null and !reporteResumenController.reporteResumenModel.listaTransacciones.isEmpty() and reporteResumenController.reporteResumenModel.tipoReporteSeleccionado==2}">
									<p:panelGrid id="pgExportertransaccion" columns="2"
										style="float:right;margin-right:2px;">

										<p:commandButton value="Descargar Documento"
											icon="ui-icon-arrowthick-1-s" ajax="false">
											<p:dataExporter type="xls" target="dtListadoTransacciones"
												fileName="lista_transaccion"
												postProcessor="#{reporteResumenController.customizeXLS}" />
										</p:commandButton>
									</p:panelGrid>
									<p:dataTable var="transaccion" id="dtListadoTransacciones"
										value="#{reporteResumenController.reporteResumenModel.listaTransacciones}"
										paginator="true" paginatorPosition="bottom" rows="10"
										paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport}
              {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
										currentPageReportTemplate="{currentPage} de {totalPages}"
										rowsPerPageTemplate="5,10,15" rowKey="#{transaccion.id}"
										style="table-layout: fixed;margin-top:30px;width:80%;"
										rowIndexVar="index">
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Numero Expediente" />
											</f:facet>
											<h:outputText
												value="#{transaccion.numeroExpediente!=null?transaccion.numeroExpediente:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Numero Tarjeta" />
											</f:facet>
											<h:outputText
												value="#{transaccion.numeroTarjeta!=null?transaccion.numeroTarjeta:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Moneda Cuenta" />
											</f:facet>
											<h:outputText
												value="#{transaccion.monedaCuenta!=null?transaccion.monedaCuenta:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha Operación" />
											</f:facet>
											<h:outputText
												value="#{transaccion.fechaOperacion!=null?transaccion.fechaOperacion:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha Posteo" />
											</f:facet>
											<h:outputText
												value="#{transaccion.fechaPosteo!=null?transaccion.fechaPosteo:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Operación" />
											</f:facet>
											<h:outputText
												value="#{transaccion.operacion!=null?transaccion.operacion:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Moneda Transaccion" />
											</f:facet>
											<h:outputText
												value="#{transaccion.monedaTransaccion!=null?transaccion.monedaTransaccion:'--'}" />
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Comercio" />
											</f:facet>
											<h:outputText
												value="#{transaccion.comercio!=null?transaccion.comercio:'--'}" />
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Monto" />
											</f:facet>
											<h:outputText
												value="#{transaccion.monto!=null?transaccion.monto:'--'}">
												<f:convertNumber pattern="#,##0.00" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Cod. Autorización" />
											</f:facet>
											<h:outputText
												value="#{transaccion.numeroAutorizacion!=null?transaccion.numeroAutorizacion:'--'}" />
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Estado" />
											</f:facet>
											<h:outputText
												value="#{transaccion.estado!=null?transaccion.estado:'--'}" />
										</p:column>

									</p:dataTable>

								</p:panel>

								<p:panel id="listaCargoPanel"
									rendered="#{reporteResumenController.reporteResumenModel.listaCargos!=null and !reporteResumenController.reporteResumenModel.listaCargos.isEmpty() and reporteResumenController.reporteResumenModel.tipoReporteSeleccionado==3}">
									<p:panelGrid id="pgExportercargo" columns="2"
										style="float:right;margin-right:2px;">

										<p:commandButton value="Descargar Documento"
											icon="ui-icon-arrowthick-1-s" ajax="false">
											<p:dataExporter type="xls" target="dtListadoCargos"
												fileName="lista_cargo"
												postProcessor="#{reporteResumenController.customizeXLS}" />
										</p:commandButton>
									</p:panelGrid>
									<p:dataTable var="cargo" id="dtListadoCargos"
										value="#{reporteResumenController.reporteResumenModel.listaCargos}"
										paginator="true" paginatorPosition="bottom" rows="10"
										paginatorTemplate="{FirstPageLink} {PreviousPageLink} {CurrentPageReport}
              {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
										currentPageReportTemplate="{currentPage} de {totalPages}"
										rowsPerPageTemplate="5,10,15" rowKey="#{cargo.id}"
										style="table-layout: fixed;margin-top:30px;width:80%;"
										rowIndexVar="index">
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Numero Expediente" />
											</f:facet>
											<h:outputText
												value="#{cargo.numeroExpediente!=null?cargo.numeroExpediente:'--'}">

											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Numero Documento" />
											</f:facet>
											<h:outputText
												value="#{cargo.numeroDocumento!=null?cargo.numeroDocumento:'--'}">

											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Nombre" />
											</f:facet>
											<h:outputText value="#{cargo.nombre!=null?cargo.nombre:'--'}">

											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha de Inicio" />
											</f:facet>
											<h:outputText
												value="#{cargo.fechaInicio!=null?cargo.fechaInicio:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>
										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha de corte" />
											</f:facet>
											<h:outputText
												value="#{cargo.fechaCorte!=null?cargo.fechaCorte:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Fecha Proceso" />
											</f:facet>
											<h:outputText
												value="#{cargo.fechaProceso!=null?cargo.fechaProceso:'--'}">
												<f:convertDateTime type="date" pattern="dd/MM/yyyy" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Número de cuenta" />
											</f:facet>
											<h:outputText
												value="#{cargo.numeroCuenta!=null?cargo.numeroCuenta:'--'}" />
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Monto cargado" />
											</f:facet>
											<h:outputText
												value="#{cargo.montoCargado!=null?cargo.montoCargado:'--'}">
												<f:convertNumber pattern="#,##0.00" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Monto pendiente por cargar" />
											</f:facet>
											<h:outputText
												value="#{cargo.montoPendiente!=null?cargo.montoPendiente:'--'}">
												<f:convertNumber pattern="#,##0.00" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Saldo Inicial Cuenta" />
											</f:facet>
											<h:outputText
												value="#{cargo.saldoInicial!=null?cargo.saldoInicial:'--'}">
												<f:convertNumber pattern="#,##0.00" />
											</h:outputText>
										</p:column>

										<p:column style="text-align: center">
											<f:facet name="header">
												<h:outputText value="Saldo Final Cuenta" />
											</f:facet>
											<h:outputText
												value="#{cargo.saldoFinal!=null?cargo.saldoFinal:'--'}">
												<f:convertNumber pattern="#,##0.00" />
											</h:outputText>
										</p:column>

									</p:dataTable>

								</p:panel>


							</center>
						</p:panel>
					</h:panelGrid>
				</p:panel>
			</center>
		</h:form>


	</ui:define>
</ui:composition>
